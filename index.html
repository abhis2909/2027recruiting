<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverage Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

  // ---- Firebase project config ----
  // This is what turns on "Sign in with Google" + per-student cloud saving.
  // Until these placeholders are replaced, the app runs exactly as before
  // (no login, saves to this browser's localStorage only).

  // it, enable Google as a sign-in provider, create a Firestore database,
  // and paste that web app's config below. Full steps are in README.md.
  var FIREBASE_CONFIG = {
    apiKey: "REPLACE_ME",
    authDomain: "REPLACE_ME.firebaseapp.com",
    projectId: "REPLACE_ME",
    storageBucket: "REPLACE_ME.appspot.com",
    messagingSenderId: "REPLACE_ME",

  if (FIREBASE_READY && window.firebase) {
    firebase.initializeApp(FIREBASE_CONFIG);
  }
</script>
<style>
  :root{
    --bg:#F6F1E5;
    --surface:#FFFEFA;
    --surface-2:#EFE5CE;
    --ink:#241F17;
    --ink-muted:#6E6455;
    --border:#E1D3B3;
    --border-strong:#CBB689;
    --accent:#6B3FA0;
    --accent-strong:#43215F;
    --accent-soft:#EFE3F7;
    --success:#2E7D4F;
    --success-soft:#DFF1E4;
    --warning:#B4740E;
    --warning-soft:#F7E8CE;
    --danger:#B23A2E;
    --danger-soft:#F6DEDA;
    --slate:#7A6F5B;
    --slate-soft:#EAE1C7;
    --rule:#C89A2E;
    --rule-soft:#F8EDCE;
    --masthead-bg:#2C1846;
    --masthead-ink:#F5ECD8;
    --masthead-ink-muted:#C6AFDE;
    --shadow: 0 1px 2px rgba(60,44,16,0.08), 0 8px 20px rgba(60,44,16,0.08);
    --font-display:'Fraunces', 'Iowan Old Style', Georgia, serif;
    --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B160F;
      --surface:#241D14;
      --surface-2:#2E2519;
      --ink:#EEE4CF;
      --ink-muted:#A9997D;
      --border:#3C3020;
      --border-strong:#4E3F29;
      --accent:#B98EE0;
      --accent-strong:#D8BCF2;
      --accent-soft:#2E2140;
      --success:#5FBE83;
      --success-soft:#1C3227;
      --warning:#E3A73B;
      --warning-soft:#332608;
      --danger:#E2685A;
      --danger-soft:#331F1B;
      --slate:#A0937A;
      --slate-soft:#2C2417;
      --rule:#E6C158;
      --rule-soft:#3A2E12;
      --masthead-bg:#170D26;
      --masthead-ink:#F0E6D2;
      --masthead-ink-muted:#C9AE86;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 20px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B160F;
    --surface:#241D14;
    --surface-2:#2E2519;
    --ink:#EEE4CF;
    --ink-muted:#A9997D;
    --border:#3C3020;
    --border-strong:#4E3F29;
    --accent:#B98EE0;
    --accent-strong:#D8BCF2;
    --accent-soft:#2E2140;
    --success:#5FBE83;
    --success-soft:#1C3227;
    --warning:#E3A73B;
    --warning-soft:#332608;
    --danger:#E2685A;
    --danger-soft:#331F1B;
    --slate:#A0937A;
    --slate-soft:#2C2417;
    --rule:#E6C158;
    --rule-soft:#3A2E12;
    --masthead-bg:#170D26;
    --masthead-ink:#F0E6D2;
    --masthead-ink-muted:#C9AE86;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 20px rgba(0,0,0,0.3);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .shell{
    max-width:1080px;
    margin:0 auto;
    padding:22px 24px 64px;
  }

  .masthead{
    background:var(--masthead-bg);
    border-bottom:3px solid var(--rule);
    background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 27px);
  }
  .masthead-inner{
    max-width:1080px;
    margin:0 auto;
    padding:22px 24px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:13px;}
  .brand-mark{
    font-size:22px; line-height:1;
    width:42px; height:42px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(212,175,55,0.14);
    border:1px solid rgba(212,175,55,0.4);
    border-radius:10px;
    flex:none;
  }
  .brand h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:27px;
    margin:0;
    letter-spacing:-0.01em;
    text-wrap:balance;
    color:var(--masthead-ink);
  }
  .tagline{
    margin:4px 0 0;
    color:var(--masthead-ink-muted);
    font-size:13.5px;
    font-style:italic;
  }

  .save-indicator{
    display:flex; align-items:center; gap:7px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--masthead-ink-muted);
    padding:6px 11px;
    border:1px solid rgba(255,255,255,0.18);
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    margin-top:4px;
  }
  .save-indicator .dot{width:7px; height:7px; border-radius:50%; background:var(--slate); flex:none;}
  .save-indicator[data-state="saved"] .dot{background:var(--success);}
  .save-indicator[data-state="saving"] .dot{background:var(--warning); animation:pulse 1s ease-in-out infinite;}
  .save-indicator[data-state="unsaved"] .dot{background:var(--warning);}
  .save-indicator[data-state="error"] .dot,
  .save-indicator[data-state="none"] .dot,
  .save-indicator[data-state="readonly"] .dot{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}

  .tabs{
    display:flex;
    gap:5px;
    border-bottom:1px solid var(--border);
    margin:0 0 22px;
    padding-top:14px;
  }
  .tab{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13.5px;
    color:var(--ink-muted);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    padding:9px 16px 10px;
    cursor:pointer;
    margin-bottom:-1px;
    box-shadow:0 -2px 0 transparent inset;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{
    color:var(--ink);
    background:var(--surface);
    box-shadow:0 2px 0 transparent inset, 0 -2.5px 0 var(--rule) inset;
  }
  .tab .count{
    font-family:var(--font-mono); font-weight:400; font-size:12px;
    color:var(--ink-muted); margin-left:6px;
  }

  .stat-row{
    display:grid;
    grid-template-columns:repeat(4, minmax(0,1fr));
    gap:12px;
    margin-bottom:22px;
  }
  .stat-tile{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .stat-tile .n{
    font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;
    font-size:22px;
    font-weight:500;
    line-height:1;
  }
  .stat-tile .n.tone-warning{color:var(--warning);}
  .stat-tile .n.tone-success{color:var(--success);}
  .stat-tile .n.tone-accent{color:var(--accent-strong);}
  .stat-tile .l{
    margin-top:6px;
    font-size:12.5px;
    color:var(--ink-muted);
  }

  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .search-input{
    font-family:var(--font-body);
    font-size:13.5px;
    padding:8px 12px;
    border:1px solid var(--border);
    border-radius:999px;
    background:var(--surface);
    color:var(--ink);
    min-width:200px;
    flex:1 1 200px;
  }
  .search-input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .search-input::placeholder{color:var(--ink-muted);}

  .toolbar-secondary{
    display:flex;
    align-items:center;
    gap:8px 12px;
    flex-wrap:wrap;
    flex-basis:100%;
    padding-top:10px;
    margin-top:2px;
    border-top:1px dashed var(--border);
  }
  .filter-label{
    font-family:var(--font-body);
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-muted);
  }
  .chip-row{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-family:var(--font-body);
    font-size:12.5px;
    font-weight:500;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-muted);
    cursor:pointer;
  }
  .chip:hover{border-color:var(--border-strong); color:var(--ink);}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  .spacer{flex:1 1 auto;}

  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13.5px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }
  .btn:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn:focus-visible, .chip:focus-visible, .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .btn-ghost{
    background:none;
    color:var(--ink-muted);
    border:1px solid var(--border);
    font-weight:500;
  }
  .btn-ghost:hover{color:var(--ink); border-color:var(--border-strong); background:var(--surface-2);}

  .table-wrap{
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    background:var(--surface);
    box-shadow:var(--shadow);
  }
  table{border-collapse:collapse; width:100%; min-width:920px;}
  thead th{
    text-align:left;
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-muted);
    padding:11px 12px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
    background:var(--surface-2);
  }
  thead th:first-child{border-top-left-radius:var(--radius-md);}
  thead th:last-child{border-top-right-radius:var(--radius-md);}
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr.flag-overdue{box-shadow:inset 3px 0 0 var(--danger);}
  tbody tr.flag-soon{box-shadow:inset 3px 0 0 var(--warning);}
  td{padding:9px 12px; font-size:13.5px; vertical-align:top;}
  td.col-notes{min-width:200px;}
  td.col-name{min-width:160px;}

  .cell-text{
    padding:4px 5px;
    border-radius:5px;
    min-height:1.3em;
    cursor:text;
    outline:none;
  }
  .cell-text:hover{background:var(--surface-2);}
  .cell-text:focus{background:var(--accent-soft); box-shadow:0 0 0 2px var(--accent) inset;}
  .cell-text.muted-empty:not(:focus)::before{content:attr(data-placeholder); color:var(--ink-muted);}

  .example-tag{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.03em;
    color:var(--ink-muted);
    border:1px dashed var(--border-strong);
    border-radius:4px;
    padding:1px 5px;
    margin-left:6px;
    vertical-align:middle;
  }

  .select-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
    border-radius:999px;
    padding:0 22px 0 10px;
    font-size:12.5px;
    font-weight:500;
  }
  .select-wrap::after{
    content:"";
    position:absolute;
    right:9px; top:50%;
    width:6px; height:6px;
    border-right:1.5px solid currentColor;
    border-bottom:1.5px solid currentColor;
    transform:translateY(-65%) rotate(45deg);
    opacity:0.6;
    pointer-events:none;
  }
  .select-wrap select{
    appearance:none;
    background:none;
    border:none;
    font-family:inherit;
    font-size:inherit;
    font-weight:inherit;
    color:inherit;
    padding:5px 0;
    cursor:pointer;
  }
  .select-wrap select:focus{outline:none;}
  .select-wrap:focus-within{box-shadow:0 0 0 2px var(--accent);}

  .tone-slate{background:var(--slate-soft); color:var(--slate);}
  .tone-accent{background:var(--accent-soft); color:var(--accent-strong);}
  .tone-success{background:var(--success-soft); color:var(--success);}
  .tone-warning{background:var(--warning-soft); color:var(--warning);}
  .tone-danger{background:var(--danger-soft); color:var(--danger);}

  .date-cell{display:flex; flex-direction:column; gap:3px;}
  .date-input{
    font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;
    font-size:12.5px;
    border:1px solid transparent;
    border-radius:5px;
    padding:3px 4px;
    background:none;
    color:var(--ink);
    width:132px;
  }
  .date-input:hover{border-color:var(--border);}
  .date-input:focus{outline:none; border-color:var(--accent); background:var(--accent-soft);}
  .date-flag{
    font-family:var(--font-mono);
    font-size:10.5px;
    padding:1px 6px;
    border-radius:999px;
    width:fit-content;
  }

  .priority-dot{display:inline-flex; align-items:center; gap:6px;}
  .priority-dot .swatch{width:8px; height:8px; border-radius:50%; background:var(--accent);}
  .priority-dot[data-level="Medium"] .swatch{background:var(--accent); opacity:0.55;}
  .priority-dot[data-level="Low"] .swatch{background:none; border:1.5px solid var(--ink-muted);}

  .link-cell{display:flex; align-items:center; gap:5px; min-height:26px;}
  .link-pill{
    display:inline-flex; align-items:center; gap:4px;
    font-size:12.5px; font-weight:500;
    color:var(--accent-strong);
    background:var(--accent-soft);
    border-radius:999px;
    padding:3px 10px;
    text-decoration:none;
  }
  .link-pill:hover{background:var(--accent); color:#fff;}
  .link-edit-btn{
    flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px;
    border-radius:5px;
    border:none; background:none;
    color:var(--ink-muted);
    cursor:pointer;
    font-size:11px;
  }
  .link-edit-btn:hover{background:var(--surface-2); color:var(--ink);}
  .link-add-btn{
    font-size:12.5px; font-weight:500;
    color:var(--ink-muted);
    background:none;
    border:1px dashed var(--border-strong);
    border-radius:999px;
    padding:3px 10px;
    cursor:pointer;
  }
  .link-add-btn:hover{color:var(--accent-strong); border-color:var(--accent);}
  .link-edit-input{
    font-family:var(--font-body);
    font-size:12.5px;
    border:1px solid var(--accent);
    border-radius:5px;
    padding:4px 6px;
    background:var(--accent-soft);
    color:var(--ink);
    width:100%;
    min-width:140px;
  }
  .link-edit-input:focus{outline:none;}

  .meeting-cell{display:flex; flex-direction:column; gap:4px; min-width:150px;}
  .meeting-input, .meeting-loc-input{
    font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;
    font-size:12px;
    border:1px solid transparent;
    border-radius:5px;
    padding:3px 4px;
    background:none;
    color:var(--ink);
    width:100%;
  }
  .meeting-loc-input{font-family:var(--font-body); font-size:12.5px;}
  .meeting-input:hover, .meeting-loc-input:hover{border-color:var(--border);}
  .meeting-input:focus, .meeting-loc-input:focus{outline:none; border-color:var(--accent); background:var(--accent-soft);}
  .btn-cal{
    display:inline-flex; align-items:center; gap:5px;
    width:fit-content;
    font-size:11px;
    font-weight:600;
    color:var(--accent-strong);
    background:var(--accent-soft);
    border-radius:999px;
    padding:3px 9px;
    text-decoration:none;
  }
  .btn-cal:hover{background:var(--accent); color:#fff;}

  .row-delete{
    background:none; border:none; cursor:pointer;
    color:var(--ink-muted);
    font-size:15px;
    padding:4px 6px;
    border-radius:5px;
    line-height:1;
  }
  .row-delete:hover{color:var(--danger); background:var(--danger-soft);}

  .empty-row td{
    padding:26px 12px;
    text-align:center;
    color:var(--ink-muted);
    font-size:13px;
  }

  .roles-intro{
    font-size:13px;
    color:var(--ink-muted);
    max-width:70ch;
    margin-bottom:14px;
    line-height:1.5;
  }
  .tag{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .office-tag{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .office-front{background:var(--accent-soft); color:var(--accent-strong);}
  .office-middle{background:var(--slate-soft); color:var(--slate);}
  .office-back{background:var(--surface-2); color:var(--ink-muted); border:1px dashed var(--border-strong);}
  .mono-cell{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:12.5px; white-space:nowrap;}
  .roles-sources{
    margin-top:14px;
    font-size:11.5px;
    line-height:1.6;
    color:var(--ink-muted);
    max-width:80ch;
  }
  .roles-sources a{color:var(--accent-strong);}

  .reminder-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:14px;
    margin-bottom:24px;
  }
  .reminder-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px 18px;
    box-shadow:var(--shadow);
  }
  .reminder-card.tone-edge-accent{border-left-color:var(--accent);}
  .reminder-card.tone-edge-warning{border-left-color:var(--warning);}
  .reminder-card.tone-edge-danger{border-left-color:var(--danger);}
  .reminder-card h3{
    margin:0;
    font-family:var(--font-display);
    font-size:16px;
    font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .count-badge{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-muted);
    background:var(--surface-2);
    border-radius:999px;
    padding:1px 8px;
    font-weight:500;
  }
  .reminder-sub{
    margin:4px 0 12px;
    font-size:12px;
    color:var(--ink-muted);
    line-height:1.4;
  }
  .empty-note{
    font-size:12.5px;
    color:var(--ink-muted);
    padding:10px 0 2px;
  }
  .reminder-list{display:flex; flex-direction:column; gap:2px;}
  .reminder-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 0;
    border-top:1px solid var(--border);
  }
  .reminder-list .reminder-row:first-child{border-top:none;}
  .reminder-info{min-width:0;}
  .reminder-name{font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .reminder-meta{font-size:11.5px; color:var(--ink-muted); margin-top:1px;}
  .reminder-actions{display:flex; align-items:center; gap:6px; flex:none;}
  .btn-mini{
    font-family:var(--font-body);
    font-size:11.5px;
    font-weight:600;
    padding:5px 10px;

  function fmtTime(dtLocal){
    var t = (dtLocal || "").split("T")[1];
    if (!t) return "";
    var bits = t.split(":");
    var h = +bits[0], m = bits[1] || "00";
    var ap = h >= 12 ? "pm" : "am";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + (m === "00" ? "" : ":" + m) + ap;
  }

  function calendarGrid(monthStr){
    var parts = monthStr.split("-");
    var year = +parts[0], month = +parts[1];
    var firstOfMonth = new Date(year, month - 1, 1);
    var daysInMonth = new Date(year, month, 0).getDate();
    var startWeekday = (firstOfMonth.getDay() + 6) % 7;
    var cells = [];
    for (var i = 0; i < startWeekday; i++) cells.push(null);
    for (var d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month - 1, d));
    while (cells.length % 7 !== 0) cells.push(null);
    return cells;
  }

  function calendarEvents(){
    var map = {};
    function add(dateStr, ev){
      if (!dateStr) return;
      var key = dateStr.slice(0, 10);
      if (!map[key]) map[key] = [];
      map[key].push(ev);
    }
    STATE.applications.forEach(function(a){
      if (!a.deadline) return;
      var tone = APP_TERMINAL[a.status] ? "slate" : (a.status === "Not Started" ? "danger" : "accent");
      add(a.deadline, {label:(a.firm || "Application") + " deadline", tone:tone, kind:"applications", id:a.id});
    });
    STATE.contacts.forEach(function(c){
      if (c.nextFollowUp) add(c.nextFollowUp, {label:"Follow up — " + (c.name || "Contact"), tone:"warning", kind:"contacts", id:c.id});
      if (c.meetingAt) add(c.meetingAt, {label:"☕ " + (c.name || "Contact") + " " + fmtTime(c.meetingAt), tone:"accent", kind:"contacts", id:c.id});
    });
    return map;
  }

      if (el && el.tagName === "INPUT") {
        el.focus();
        el.select();
      } else if (el) {
        el.focus();
        var range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      UI.focusTarget = null;
    }
  }

    var y = +parts[0], m = +parts[1] - 1 + delta;
    var d = new Date(y, m, 1);
    UI.calendarMonth = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    mount();
  }

  function gotoItem(kind, id){
    UI.tab = kind;
    UI.search = "";
    UI.filter = "all";
    UI.trackFilter = "all";
    UI.priorityFilter = "all";
    mount();
    var row = document.querySelector('tr[data-id="' + id + '"]');
    if (row) {
      row.scrollIntoView({behavior:"smooth", block:"center"});
      row.classList.add("row-flash");
      setTimeout(function(){ row.classList.remove("row-flash"); }, 1600);
    }
  }

  function findRow(el, kind){
    var tr = el.closest("tr[data-id]");
    var tbody = el.closest("tbody[data-kind]");
    if (!tr || !tbody) return null;
    var arr = STATE[tbody.dataset.kind];
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === tr.dataset.id) return {item:arr[i], index:i, kind:tbody.dataset.kind};
    }
    return null;
  }

  function scheduleSave(){
    UI.saveState = (UI.saveState === "readonly" || UI.saveState === "none") ? UI.saveState : "unsaved";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 1100);
  }

  function buildFullDocument(){
    var scriptSrc = document.getElementById("app-script").textContent;
    var stateJson = JSON.stringify(STATE).replace(/</g, "\\u003c");
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Coverage Book</title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<style>" + STYLE_TEXT + "</style>\n</head>\n<body>\n<div id=\"app\"></div>\n<script type=\"application/json\" id=\"initial-state\">" + stateJson + "<" + "/script>\n<script id=\"app-script\">" + scriptSrc + "<" + "/script>\n</body>\n</html>";
  }

  function doSave(){
    if (PERSIST_MODE === "pending") { saveTimer = setTimeout(doSave, 400); return; }

    if (PERSIST_MODE === "cloud") {
      UI.saveState = "saving";
      mount();
      cap.publish(buildFullDocument()).then(function(){
        UI.saveState = "saved";
        mount();
      }).catch(function(err){
        var code = err && err.code;
        if (code === "conflict") { return; }
        if (code === "not_writer" || code === "not_granted" || code === "consent_required") {
          UI.saveState = "readonly";
          mount();
          return;
        }
        UI.saveState = "error";
        mount();
        saveTimer = setTimeout(doSave, 4000);
      });
      return;
    }

    if (PERSIST_MODE === "local") {
      UI.saveState = "saving";
      mount();
      try {
        window.localStorage.setItem(LS_KEY, JSON.stringify(STATE));
        UI.saveState = "saved";
      } catch (e) {
        UI.saveState = "error";
        saveTimer = setTimeout(doSave, 4000);
      }
      mount();
      return;
    }

    if (PERSIST_MODE === "firebase") {
      if (!CURRENT_USER) { UI.saveState = "none"; mount(); return; }
      UI.saveState = "saving";
      mount();
      fbDb.collection("users").doc(CURRENT_USER.uid).set(STATE).then(function(){
        UI.saveState = "saved";
        mount();
      }).catch(function(){
        UI.saveState = "error";
        mount();
        saveTimer = setTimeout(doSave, 4000);
      });
      return;
    }

    UI.saveState = "none";
    mount();
  }

  function initLegacyPersistence(){
    capPromise = (window.claude && window.claude.use) ? window.claude.use("artifact") : Promise.resolve(null);
    capPromise.then(function(c){
      cap = c;
      if (c) {
        PERSIST_MODE = "cloud";
      } else if (localStorageAvailable()) {
        PERSIST_MODE = "local";
        loadLocalState();
      } else {
        PERSIST_MODE = "none";
      }
      if (UI.saveState === "unsaved") { doSave(); } else { UI.saveState = PERSIST_MODE === "none" ? "none" : "saved"; mount(); }
    }).catch(function(){
      if (localStorageAvailable()) { PERSIST_MODE = "local"; loadLocalState(); }
      else { PERSIST_MODE = "none"; }
      UI.saveState = PERSIST_MODE === "none" ? "none" : "saved";
      mount();
    });
  }

  // ---- Firebase auth + per-student cloud storage ----
  function initFirebaseAuth(){
    fbDb = firebase.firestore();
    document.body.dataset.authState = "pending";

    var googleBtn = document.getElementById("auth-google-btn");
    var note = document.getElementById("auth-gate-note");
    googleBtn.addEventListener("click", function(){
      note.textContent = "";
      var provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider).catch(function(err){
        note.textContent = "Sign-in failed: " + ((err && err.message) || "please try again.");
      });
    });

    firebase.auth().onAuthStateChanged(function(user){
      if (!user) {
        CURRENT_USER = null;
        PERSIST_MODE = "pending";
        document.body.dataset.authState = "gate";
        return;
      }
      CURRENT_USER = user;
      document.body.dataset.authState = "in";
      loadFirebaseState(user);
    });
  }

  function loadFirebaseState(user){
    var docRef = fbDb.collection("users").doc(user.uid);
    docRef.get().then(function(snap){
      if (snap.exists) {
        STATE = snap.data();
        if (!STATE.roleNotes) STATE.roleNotes = {};
        PERSIST_MODE = "firebase";
        UI.saveState = "saved";
        mount();
        return;
      }
      // First sign-in: carry over anything already sitting in this
      // browser's local copy, so nothing gets lost when login turns on.
      var migrated = false;
      if (localStorageAvailable()) {
        try {
          var raw = window.localStorage.getItem(LS_KEY);
          if (raw) {
            var local = JSON.parse(raw);
            if ((local.applications && local.applications.length) || (local.contacts && local.contacts.length)) {
              STATE = local;
              if (!STATE.roleNotes) STATE.roleNotes = {};
              migrated = true;
            }
          }
        } catch (e) {}
      }
      PERSIST_MODE = "firebase";
      UI.saveState = "unsaved";
      mount();
      doSave();
      if (migrated) showToast("Brought over your saved data from this browser.");
    }).catch(function(){
      PERSIST_MODE = "firebase";
      UI.saveState = "error";
      mount();
    });
  }

  if (FIREBASE_READY && window.firebase) {
    initFirebaseAuth();
  } else {
    initLegacyPersistence();
  }

  function showToast(message, undoFn){
    clearTimeout(toastTimer);
    UI.toast = {message:message, undo:!!undoFn};
    window.__undo = undoFn || null;
    mount();
    toastTimer = setTimeout(function(){ UI.toast = null; mount(); }, 5000);
  }

  function newApplication(){
    return {id:uid(), firm:"", role:"", link:"", track:"Internship", status:"Not Started", applied:"", deadline:"", priority:"Medium", notes:"", isExample:false, createdAt:TODAY};
  }
  function newContact(){
    return {id:uid(), name:"", firm:"", role:"", linkedin:"", status:"To Reach Out", lastContact:"", nextFollowUp:"", meetingAt:"", meetingLocation:"", source:"", notes:"", isExample:false, createdAt:TODAY};
  }
  function getItem(kind, id){
    var arr = STATE[kind] || [];
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
    return null;
  }

  document.getElementById("app").addEventListener("click", function(e){
    var t = e.target;
    var actionEl = t.closest("[data-action]");
    if (!actionEl) return;
    var action = actionEl.dataset.action;

    if (action === "sign-out") {
      if (window.firebase && firebase.auth) firebase.auth().signOut();
    } else if (action === "switch-tab") {
      UI.tab = actionEl.dataset.tab;
      UI.search = "";
      UI.filter = "all";
      UI.trackFilter = "all";
      UI.priorityFilter = "all";
      mount();
    } else if (action === "filter") {
      UI.filter = actionEl.dataset.filter;
      mount();
    } else if (action === "filter-track") {
      UI.trackFilter = actionEl.dataset.filter;
      mount();
    } else if (action === "filter-priority") {
      UI.priorityFilter = actionEl.dataset.filter;
      mount();
    } else if (action === "add-application") {
      var na = newApplication();
      STATE.applications.unshift(na);
      UI.focusTarget = {id:na.id, field:"firm"};
      mount();
      scheduleSave();
    } else if (action === "add-contact") {
      var nc = newContact();
      STATE.contacts.unshift(nc);
      UI.focusTarget = {id:nc.id, field:"name"};
      mount();
      scheduleSave();
    } else if (action === "clear-examples") {
      STATE.applications = STATE.applications.filter(function(a){ return !a.isExample; });
      STATE.contacts = STATE.contacts.filter(function(c){ return !c.isExample; });
      mount();
      scheduleSave();
    } else if (action === "delete") {
      var found = findRow(actionEl, UI.tab);
      if (found) {
        STATE[found.kind].splice(found.index, 1);
        var label = found.kind === "applications" ? (found.item.firm || "Application") : (found.item.name || "Contact");
        mount();
        scheduleSave();
        showToast(label + " removed.", function(){
          STATE[found.kind].splice(found.index, 0, found.item);
          mount();
          scheduleSave();
        });
      }
    } else if (action === "undo-delete") {
      if (window.__undo) window.__undo();
      UI.toast = null;
      clearTimeout(toastTimer);
      mount();
    } else if (action === "edit-link") {
      var linkRow = findRow(actionEl, UI.tab);
      if (linkRow) {
        UI.editingLink = {id:linkRow.item.id, field:actionEl.dataset.field};
        UI.focusTarget = {id:linkRow.item.id, field:actionEl.dataset.field};
        mount();
      }
    } else if (action === "quick-mark-reached") {
      var qc = getItem("contacts", actionEl.dataset.id);
      if (qc) { qc.status = "Reached Out"; qc.lastContact = TODAY; mount(); scheduleSave(); }
    } else if (action === "quick-log-contact") {
      var qc2 = getItem("contacts", actionEl.dataset.id);
      if (qc2) { qc2.lastContact = TODAY; qc2.nextFollowUp = ""; mount(); scheduleSave(); }
    } else if (action === "quick-mark-applied") {
      var qa = getItem("applications", actionEl.dataset.id);
      if (qa) { qa.status = "Applied"; qa.applied = TODAY; mount(); scheduleSave(); }
    } else if (action === "goto-item") {
      gotoItem(actionEl.dataset.kind, actionEl.dataset.id);
    } else if (action === "cal-prev") {
      shiftMonth(-1);
    } else if (action === "cal-next") {
      shiftMonth(1);
    } else if (action === "cal-today") {
      UI.calendarMonth = TODAY.slice(0, 7);
      mount();
    }
  });

  document.getElementById("app").addEventListener("focusout", function(e){
    var t = e.target;
    if (!t.matches(".link-edit-input")) return;
    var found = findRow(t, UI.tab);
    if (found) {
      var v = t.value.trim();
      if (found.item[t.dataset.field] !== v) {
        found.item[t.dataset.field] = v;
        scheduleSave();
      }
    }
    UI.editingLink = null;
    mount();
  });

  document.getElementById("app").addEventListener("keydown", function(e){
    if (!e.target.matches(".link-edit-input")) return;
    if (e.key === "Enter") { e.preventDefault(); e.target.blur(); }
    else if (e.key === "Escape") { e.preventDefault(); UI.editingLink = null; mount(); }
  });

  document.getElementById("app").addEventListener("input", function(e){
    var t = e.target;
    if (t.matches(".search-input")) {
      UI.search = t.value;
      var pos = t.selectionStart;
      mount();
      var again = document.querySelector(".search-input");
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
      return;
    }
    if (t.matches(".role-note")) {
      STATE.roleNotes[t.dataset.roleId] = t.textContent;
      scheduleSave();
      return;
    }
    if (t.matches(".cell-text")) {
      var found = findRow(t, UI.tab);
      if (found) {
        found.item[t.dataset.field] = t.textContent;
        scheduleSave();
      }
    }
  });

  document.getElementById("app").addEventListener("change", function(e){
    var t = e.target;
    if (t.matches("select") || t.matches(".date-input") || t.matches(".meeting-input") || t.matches(".meeting-loc-input")) {
      var found = findRow(t, UI.tab);
      if (found) {
        found.item[t.dataset.field] = t.value;
        mount();
        scheduleSave();
      }
    }
  });

  var STYLE_TEXT = document.querySelector("style").textContent;

  // ---- Hover-to-preview panel for application/contact links ----
  (function setupLinkPreview(){
    var canHover = window.matchMedia && window.matchMedia("(hover:hover) and (pointer:fine)").matches;
    if (!canHover) return; // touch/phone: keep the plain tap-to-open-tab behavior

    var panel = document.getElementById("link-preview-panel");
    var frame = document.getElementById("link-preview-frame");
    var firmEl = document.getElementById("link-preview-firm");
    var roleEl = document.getElementById("link-preview-role");
    var urlEl = document.getElementById("link-preview-url");
    var openEl = document.getElementById("link-preview-open");
    var closeBtn = document.getElementById("link-preview-close");

    var openUrl = null;
    var showTimer = null;
    var hideTimer = null;

    function labelFor(pill){
      var row = findRow(pill);
      if (row && row.kind === "applications") {
        return {title: row.item.firm || "Unnamed firm", sub: row.item.role || ""};
      }
      if (row && row.kind === "contacts") {
        return {title: row.item.name || "Unnamed contact", sub: [row.item.firm, row.item.role].filter(Boolean).join(" · ")};
      }
      return {title: "Link preview", sub: ""};
    }

    function openPanel(pill){
      var url = pill.href;
      if (!url) return;
      clearTimeout(hideTimer);
      var label = labelFor(pill);
      firmEl.textContent = label.title;
      roleEl.textContent = label.sub;
      urlEl.textContent = url;
      openEl.href = url;
      if (openUrl !== url) {
        frame.src = url;
        openUrl = url;
      }
      panel.classList.add("is-open");
    }

    function scheduleHide(){
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function(){
        panel.classList.remove("is-open");
        frame.src = "about:blank";
        openUrl = null;
      }, 300);
    }

    document.addEventListener("mouseover", function(e){
      var pill = e.target.closest(".link-pill");
      if (pill) {
        clearTimeout(showTimer);
        showTimer = setTimeout(function(){ openPanel(pill); }, 220);
        return;
      }
      if (!e.target.closest(".link-preview-panel")) {
        clearTimeout(showTimer);
      }
    });

    document.addEventListener("mouseout", function(e){
      var leavingPill = e.target.closest(".link-pill");
      var leavingPanel = e.target.closest(".link-preview-panel");
      if (!leavingPill && !leavingPanel) return;
      var to = e.relatedTarget;
      if (to && (to.closest && (to.closest(".link-pill") || to.closest(".link-preview-panel")))) return;
      clearTimeout(showTimer);
      scheduleHide();
    });

    closeBtn.addEventListener("click", function(){
      clearTimeout(hideTimer);
      panel.classList.remove("is-open");
      frame.src = "about:blank";
      openUrl = null;
    });

    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && panel.classList.contains("is-open")) {
        panel.classList.remove("is-open");
        frame.src = "about:blank";
        openUrl = null;
      }
    });
  })();

  mount();
})();
</script>
</body>
</html>
